    html,body{height:100%;overflow:hidden;background:#000}

    #wrap svg{transform:scale(var(--fitw,1.76),var(--fith,1.28))!important;transform-origin:50% 50%}
    #rabhai-fs{position:fixed;left:10px;top:10px;z-index:70;padding:8px 13px;border-radius:20px;
      border:1px solid rgba(245,185,66,.55);background:rgba(10,9,8,.85);color:#f5b942;font:12px -apple-system,Roboto,sans-serif}
    #fitbar{position:fixed;left:10px;top:56px;z-index:70;display:flex;gap:6px;align-items:center;padding:5px 8px;
      border-radius:20px;border:1px solid rgba(245,185,66,.4);background:rgba(10,9,8,.85);color:#f5b942;
      font:12px -apple-system,Roboto,sans-serif}

      background:rgba(245,185,66,.12);color:#f5b942;font-size:14px;line-height:1}

  <button id="rabhai-fs">⛶ Full screen</button>
  <div id="fitbar"><span class="lbl">W</span><button id="fw-">−</button><span id="fw-v">176%</span><button id="fw+">+</button>
    <span class="lbl" style="margin-left:6px">H</span><button id="fh-">−</button><span id="fh-v">128%</span><button id="fh+">+</button></div>
  <script>
    (function(){
      var el=document.documentElement;
      var w=parseFloat(localStorage.getItem('rabhai.fitw')||'1.76');
      var h=parseFloat(localStorage.getItem('rabhai.fith')||'1.28');
      function apply(){ el.style.setProperty('--fitw',w); el.style.setProperty('--fith',h);
        document.getElementById('fw-v').textContent=Math.round(w*100)+'%';
        document.getElementById('fh-v').textContent=Math.round(h*100)+'%';
        localStorage.setItem('rabhai.fitw',w); localStorage.setItem('rabhai.fith',h); }
      document.getElementById('fw-').onclick=function(){ w=Math.max(.6,+(w-.04).toFixed(2)); apply(); };
      document.getElementById('fw+').onclick=function(){ w=Math.min(2.4,+(w+.04).toFixed(2)); apply(); };
      document.getElementById('fh-').onclick=function(){ h=Math.max(.6,+(h-.04).toFixed(2)); apply(); };
      document.getElementById('fh+').onclick=function(){ h=Math.min(2.4,+(h+.04).toFixed(2)); apply(); };
      apply();
      var fs=document.getElementById('rabhai-fs');
      fs.onclick=function(){ var d=document.documentElement;
        Promise.resolve(d.requestFullscreen?d.requestFullscreen():d.webkitRequestFullscreen())
          .then(function(){ if(screen.orientation&&screen.orientation.lock) return screen.orientation.lock('landscape'); })
          .then(function(){ fs.style.display='none'; }).catch(function(){ fs.textContent='Use ⛶ in the browser menu'; }); };
      var cols=['#7bd88f','#ef476f','#4cc9f0'];
      document.querySelectorAll('text.log-line').forEach(function(t,i){ t.setAttribute('fill',cols[i%3]); });
      document.querySelectorAll('svg circle').forEach(function(c){
        var r=c.getAttribute('r');
        if(r==='86.4'){ c.setAttribute('stroke','#7bd88f'); c.classList.add('spinA'); }
        if(r==='63.9'){ c.setAttribute('stroke','#4cc9f0'); c.classList.add('spinB'); }
        if(r==='8.6'){ c.setAttribute('fill','#ef476f'); c.classList.add('beat2'); }
      });
    })();
  </script>

            if(parseFloat(getComputedStyle(f).opacity)<0.2) continue;
            var r=f.getBoundingClientRect();
            if(Math.abs(r.left+r.width/2-cx)<40 && Math.abs(r.top+r.height/2-cy)<40){ near=true; break; }
          }
          if(near) d.classList.add('open'); else d.classList.remove('open');
        });
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
