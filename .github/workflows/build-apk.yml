name: Build RabhAI APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Locate the project and build
        run: |
          echo "--- repository tree ---"
          find . -maxdepth 3 -not -path './.git*' | sort | head -40
          SETTINGS=$(find . -name 'settings.gradle.kts' -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          DIR=$(dirname "$SETTINGS")
          echo "--- building in $DIR ---"
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rabhai-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
